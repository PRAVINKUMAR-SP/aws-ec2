name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: maven

      - name: Build Spring Boot Backend
        run: |
          cd backend
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build React Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Copy Files to EC2 via SCP
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # We transfer the backend JAR and the frontend dist folder
          source: "backend/target/*.jar,frontend/dist/*"
          target: "/home/ec2-user/deploy-temp/"
          strip_components: 1

      - name: Execute Deployment Script via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Moving frontend files to Nginx directory..."
            sudo mkdir -p /var/www/shivani
            sudo rm -rf /var/www/shivani/*
            sudo cp -r /home/ec2-user/deploy-temp/dist/* /var/www/shivani/
            
            echo "Checking disk space..."
            df -h
            
            echo "Stopping backend systemd service..."
            sudo systemctl stop shivani-backend || true
            
            echo "Moving backend JAR..."
            sudo mkdir -p /opt/aws-ec2-backend
            sudo mkdir -p /home/ec2-user/aws-ec2/backend/target
            sudo find /home/ec2-user/deploy-temp -name "*.jar" -type f -exec cp {} /opt/aws-ec2-backend/app.jar \;
            sudo find /home/ec2-user/deploy-temp -name "*.jar" -type f -exec cp {} /home/ec2-user/aws-ec2/backend/target/aws-login-test-backend-0.0.1-SNAPSHOT.jar \;
            
            echo "Checking DatabaseFixer inside JAR..."
            jar tf /home/ec2-user/aws-ec2/backend/target/aws-login-test-backend-0.0.1-SNAPSHOT.jar | grep DatabaseFixer || echo "WARNING: DatabaseFixer NOT found in JAR!"
            
            echo "DEBUG INFO" | sudo tee /var/www/shivani/debug.txt
            echo "Files in deploy-temp:" | sudo tee -a /var/www/shivani/debug.txt
            sudo find /home/ec2-user/deploy-temp | sudo tee -a /var/www/shivani/debug.txt
            echo "MD5 of app.jar:" | sudo tee -a /var/www/shivani/debug.txt
            md5sum /opt/aws-ec2-backend/app.jar | sudo tee -a /var/www/shivani/debug.txt
            
            echo "Cleaning up temp deployment files..."
            rm -rf /home/ec2-user/deploy-temp
            
            echo "Force killing any remaining java processes to prevent port 8080 conflicts (502 error)..."
            sudo killall -9 java || true
            sleep 2
            
            echo "Starting backend systemd service..."
            sudo systemctl start shivani-backend
            
            echo "Waiting 20 seconds for Spring Boot to initialize..."
            sleep 20
            
            echo "=== BACKEND STATUS ==="
            sudo systemctl status shivani-backend --no-pager || true
            
            echo "=== LAST 100 LINES OF BACKEND LOG ==="
            sudo journalctl -u shivani-backend -n 100 --no-pager | sudo tee /var/www/shivani/backend-error.txt
            
            echo "Restarting Nginx and fixing 413 upload size limit..."
            echo "client_max_body_size 50M;" | sudo tee /etc/nginx/conf.d/upload_size.conf
            sudo systemctl restart nginx
            
            echo "Deployment complete."
